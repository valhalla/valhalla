# https://www.mkdocs.org/user-guide/configuration/

theme:
  name: material
  logo: images/valhalla_logo.svg
  favicon: images/valhalla_logo.svg
  features:
    - content.tabs.link
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: black
      accent: deep purple

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: white
      accent: lime

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details

plugins:
  - search
  - redirects:
      redirect_maps:
        'valhalla-intro.md': 'start/introduction.md'
        'building.md': 'start/building.md'
        'terminology.md': 'start/terminology.md'
        'decoding.md': 'api/decoding.md'
        'api/turn-by-turn/overview.md': 'api/route/overview.md'
        'api/turn-by-turn/api-reference.md': 'api/route/api-reference.md'
        'api/optimized/api-reference.md': 'api/optimized.md'
        'api/matrix/api-reference.md': 'api/matrix.md'
        'api/isochrone/api-reference.md': 'api/isochrone.md'
        'api/map-matching/api-reference.md': 'api/map-matching.md'
        'api/locate/api-reference.md': 'api/locate.md'
        'api/elevation/api-reference.md': 'api/elevation.md'
        'api/expansion/api-reference.md': 'api/expansion.md'
        'api/status/api-reference.md': 'api/status.md'
        'api/tile/api-reference.md': 'api/tile.md'
        'README_python.md': 'bindings/python/index.md'
        'README_nodejs.md': 'bindings/nodejs.md'
        'python/actor.md': 'bindings/python/api/actor.md'
        'python/config.md': 'bindings/python/api/config.md'
        'python/graph_utils.md': 'bindings/python/api/graph_utils.md'
        'python/predicted_speeds.md': 'bindings/python/api/predicted_speeds.md'
        'python/decode_polyline.md': 'bindings/python/api/decode_polyline.md'
        'python/exceptions.md': 'bindings/python/api/exceptions.md'
        'route_overview.md': 'concepts/index.md'
        'mjolnir/why_tiles.md': 'concepts/why-tiles.md'
        'tiles.md': 'concepts/tiles.md'
        'speeds.md': 'concepts/speeds.md'
        'mjolnir/historical_traffic.md': 'concepts/historical-traffic.md'
        'incidents.md': 'concepts/incidents.md'
        'change_identification.md': 'concepts/change-identification.md'
        'elevation.md': 'concepts/elevation.md'
        'sif/dynamic-costing.md': 'concepts/costing/dynamic-costing.md'
        'sif/elevation_costing.md': 'concepts/costing/elevation-costing.md'
        'testing.md': 'contributing/testing.md'
        'test/gurka.md': 'contributing/gurka.md'
        'releasing.md': 'contributing/releasing.md'
        'tzdb_update.md': 'contributing/tzdb-update.md'
        'locales.md': 'contributing/locales.md'
        'mjolnir/data_sources.md': 'contributing/data/data-sources.md'
        'mjolnir/admins.md': 'contributing/data/admins.md'
        'mjolnir/attribution.md': 'contributing/data/attribution.md'
        'baldr.md': 'contributing/architecture/baldr.md'
        'loki.md': 'contributing/architecture/loki.md'
        'midgard.md': 'contributing/architecture/midgard.md'
        'odin.md': 'contributing/architecture/odin.md'
        'sif.md': 'contributing/architecture/sif.md'
        'skadi.md': 'contributing/architecture/skadi.md'
        'tyr.md': 'contributing/architecture/tyr.md'
        'thor.md': 'contributing/architecture/thor/index.md'
        'thor/path-algorithm.md': 'contributing/architecture/thor/path-algorithm.md'
        'thor/isochrones.md': 'contributing/architecture/thor/isochrones.md'
        'meili.md': 'contributing/architecture/meili/index.md'
        'meili/overview.md': 'contributing/architecture/meili/index.md'
        'meili/algorithms.md': 'contributing/architecture/meili/algorithms.md'
        'meili/configuration.md': 'contributing/architecture/meili/configuration.md'
        'meili/implementation_details.md': 'contributing/architecture/meili/implementation-details.md'
        'meili/library_api.md': 'contributing/architecture/meili/library-api.md'
        'meili/service_api.md': 'contributing/architecture/meili/service-api.md'
        'mjolnir.md': 'contributing/architecture/mjolnir/index.md'
        'mjolnir/tag_parsing.md': 'contributing/architecture/mjolnir/tag-parsing.md'
        'mjolnir/geojson.md': 'contributing/architecture/mjolnir/geojson.md'
        'mjolnir/getting_started_guide.md': 'contributing/architecture/mjolnir/index.md'
        'mjolnir/map_roulette.md': 'contributing/architecture/mjolnir/map-roulette.md'
        'mjolnir/map_roulette_blog.md': 'contributing/architecture/mjolnir/map-roulette-blog.md'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../src/bindings/python]
          options:
            # parse :param:/:returns:/:raises: RST directives in docstrings
            docstring_style: sphinx
            # render param/return/raise blocks as a typed table with a description column
            docstring_section_style: spacy
            # list members in source order, not alphabetical
            members_order: source
            # render the symbol's name as the page's main heading
            show_root_heading: true
            # heading shows "Actor" rather than the full dotted path "valhalla.actor.Actor"
            show_root_full_path: false
            # fold __init__'s params/docs into the class entry instead of a nested section
            merge_init_into_class: true
            # render the signature on its own line below the symbol name (more readable for long sigs)
            separate_signature: true
            # include type hints in the rendered signature
            show_signature_annotations: true
            # surface members inherited from base classes (e.g. _Actor methods on Actor)
            inherited_members: true
            # don't render a [source] link/snippet per symbol — paths point inside .pyi anyway
            show_source: false
            # hide underscore-prefixed members (e.g. _Actor, _GraphUtils) from the rendered output
            filters: ["!^_"]

validation:
  anchors: warn

