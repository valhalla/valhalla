name: manylinux image

# builds and overwrites ghcr.io/valhalla/manylinux:2_28_valhalla_python for x86 & aarch64
# needed for the python & js package builds on linux

# gets only rebuilt manually on demand, e.g. new Python release or more source builds

on:
  workflow_dispatch:

env:
  REPO: ghcr.io/valhalla/manylinux
  IMAGE: ghcr.io/valhalla/manylinux:2_28_valhalla_python-test

permissions:
  contents: read
  packages: write

jobs:
  build:
    # no forks, TODO: and don't overwrite the image from a branch
    if: ${{ github.repository_owner == 'valhalla' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker/manylinux

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/manylinux
          build-args: ARCH=${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.REPO }}:manylinuxbuildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REPO }}:manylinuxbuildcache-${{ matrix.arch }},mode=max

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-x86_64" "$IMAGE-aarch64"
