name: lint
on: [pull_request]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Validate changelog
        shell: bash
        run: |
          # we dont enforce this on a draft
          if [[ "$(jq --raw-output .pull_request.draft ${GITHUB_EVENT_PATH})" == "true" ]]; then
            exit 0
          fi

          # get some info about the pr
          PR_BASE=$(jq --raw-output .pull_request.base.ref ${GITHUB_EVENT_PATH})
          PR_NUMBER=$(jq --raw-output .pull_request.number ${GITHUB_EVENT_PATH})
          PR_TITLE=$(jq --raw-output .pull_request.title ${GITHUB_EVENT_PATH})

          # check if anything has changed against the base branch for the changelog
          git fetch origin ${PR_BASE} --depth 1
          LINE_COUNT=$(git diff origin/${PR_BASE} -- CHANGELOG.md | wc -l)

          # no entry in the changelog is bad in most cases, lets suggest an entry          
          if [ ${LINE_COUNT} -eq 0 ]; then
            printf "\x1b[31;1mNo CHANGELOG entries detected. Consider whether this PR warrents one, for example:\x1b[0m\n"
            printf "\x1b[33;1m* ${PR_TITLE} [#${PR_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})\x1b[0m\n"
            exit 1
          fi

          #TODO: validate changelog line format

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Spell-check
        uses: crate-ci/typos@v1.15.7
        with:
          config: ./.github/workflows/typos.toml

  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Checkout polib
        run: git submodule update --init third_party/polib

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Validate .po syntax
        run: for f in locales/*.po; do msgfmt --check -o /dev/null "$f"; done

      - name: Check placeholder tokens
        run: python3 locales/po_tools.py lint

      - name: Check valhalla.pot is in sync with en-US.json
        run: |
          python3 locales/po_tools.py json2pot
          if ! git diff --exit-code locales/valhalla.pot; then
            printf "\x1b[31;1mvalhalla.pot is stale. After changing en-US.json, run:\x1b[0m\n"
            printf "\x1b[33;1m  python3 locales/po_tools.py update\x1b[0m\n"
            printf "\x1b[33;1mand commit the .pot and .po changes (see docs/docs/locales.md).\x1b[0m\n"
            exit 1
          fi

      - name: Check the JSONs can be generated
        run: python3 locales/po_tools.py po2json --out /tmp/locales-json
