[package]
name = "ferry-lines"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `proto` feature: this example only reads tiles, it never calls the Actor.
valhalla = { path = "../..", default-features = false }

[dev-dependencies]
pretty_assertions = "1"
